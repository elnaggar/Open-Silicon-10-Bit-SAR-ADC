# LibreLane RTL-to-GDS config -- SSCS Chipathon 2026 tapeout
# Design : 10-bit SAR logic controller – DIFFERENTIAL variant (hardened macro)
# PDK    : GlobalFoundries 180nm MCU (gf180mcu)
#
# --- INTEGRATION NOTE ---
# This macro is characterized at 3.3V (matches the 0-3V ADC analog domain).
# The gf180mcu digital cells are the 5V-tolerant device family (mcu7t5v0),
# but the timing here is signed off at the 3.3V corners. If this block is
# integrated onto a 5V digital rail, level-shifting is required at the
# DAC-switch / control boundary. A 3.3V-characterized macro dropped into a
# 5V grid is a silent functional bug.

DESIGN_NAME: sar_logic_diff

# --- Sources ---
VERILOG_FILES: dir::src/sar_logic_diff.v

# --- PDK / standard cells ---
PDK: gf180mcuD
STD_CELL_LIBRARY: gf180mcu_fd_sc_mcu7t5v0   # 5V-tolerant device family, 3.3V corners used below

# --- Corners (3.3V) ---
# The shipped gf180mcuD uses an OpenLane-1-style single-lib PDK config that
# does not define LibreLane corner tables for this library, so we define them
# explicitly here. Do NOT delete this block thinking it's redundant -- without
# it, LIB resolves empty and synthesis (dfflibmap) fails with no -liberty.
# (If you later move to a PDK build matching your LibreLane version, these
#  corners may be inherited natively and this block can be removed.)
DEFAULT_CORNER: nom_tt_025C_3v30
STA_CORNERS:
  - nom_tt_025C_3v30
  - nom_ff_n40C_3v60
  - nom_ss_125C_3v00
LIB:
  "nom_tt_025C_3v30": [pdk_dir::libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__tt_025C_3v30.lib]
  "nom_ff_n40C_3v60": [pdk_dir::libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__ff_n40C_3v60.lib]
  "nom_ss_125C_3v00": [pdk_dir::libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__ss_125C_3v00.lib]

# --- Clocking ---
# 40 ns = 25 MHz. The differential FSM (sar_logic_diff) uses ~51 clocks per
# conversion with default parameters:
#   ACQ_CYCLES=8 + (SETTLE_CYC=2 + CMP_CYC=1 + LATCH=1)*10 bits
#   + HOLD_T + HOLD_B + DONE = ~51 total.
# At 1 MS/s target sample rate that requires ~51 MHz; at the guaranteed
# 500 kS/s only ~25.5 MHz. A 40 ns (25 MHz) clock comfortably meets the
# guaranteed spec and leaves room for the analog settling budget.
#
# Compared to sar_logic's 80 ns, this is 2× tighter because the differential
# FSM breaks each bit-trial into explicit SETTLE/CMP/LATCH sub-states.
CLOCK_PORT: clk
CLOCK_PERIOD: 40                            # ns  (25 MHz)
PNR_SDC_FILE: dir::pnr.sdc
SIGNOFF_SDC_FILE: dir::signoff.sdc



# Max fanout reverted to 6. The aggressive setting of 4 caused massive buffer
# insertion leading to DPL-0036 (detailed placement failed). We rely on
# RUN_POST_GRT_DESIGN_REPAIR instead to fix max slew.
MAX_FANOUT_CONSTRAINT: 4
MAX_TRANSITION_CONSTRAINT: 3.0

# --- Floorplan: auto-size from utilization ---
# The 40 ns clock is 2× tighter than sar_logic (80 ns), causing the resizer
# to insert more buffers. CTS and hold-fixing add even more cells *after*
# initial placement. The diode insertion step (antenna mitigation) further
# increases cell count. A loose 35% utilization leaves headroom for all of
# these post-placement insertions.
FP_SIZING: relative
# Lowered FP_CORE_UTIL from 35 to 25 to give the resizer more physical die area
# to legally place CTS and timing repair buffers without failing DPL-0036. Reverting to 45 to save area.
FP_CORE_UTIL: 45
# Keep target density high enough to satisfy global placement
PL_TARGET_DENSITY_PCT: 65
VDD_PIN: VDD
GND_PIN: VSS
VDD_NETS: [VDD]
GND_NETS: [VSS]
IO_PIN_ORDER_CFG: dir::pin_order.cfg
PDN_CORE_RING : true
PDN_CORE_RING_HWIDTH: 2.0
PDN_CORE_RING_VWIDTH: 2.0
PDN_CORE_RING_HSPACING: 1.5
PDN_CORE_RING_VSPACING: 1.5
PDN_CORE_RING_HOFFSET: 1.0
PDN_CORE_RING_VOFFSET: 1.0

# --- Placement padding: leaves room for later insertions (diodes, hold buffers) ---
# Reduced from 3 to 2 to avoid DPL-0036 failures when antenna diodes are added.
GPL_CELL_PADDING: 2
DPL_CELL_PADDING: 2

# --- Power distribution (macro power grid) ---
PDN_MULTILAYER: true                      # renamed from FP_PDN_MULTILAYER
# NOTE: if the PDN report shows "no straps" because the macro is tiny,
# reduce the strap pitch, e.g.:
# Set these pitches smaller than the width/height of your macro
FP_PDN_HPITCH: 15.0  
FP_PDN_VPITCH: 15.0  
# Ensure the straps have defined widths
FP_PDN_VWIDTH: 1.5
FP_PDN_HWIDTH: 1.5

# --- Antenna mitigation (needed for clean antenna signoff) ---
RUN_ANTENNA_REPAIR: true                    # renamed from GRT_REPAIR_ANTENNAS
RUN_HEURISTIC_DIODE_INSERTION: true
DIODE_ON_PORTS: in

# --- Post-GRT repair: enable resizer to fix remaining slew violations ---
RUN_POST_GRT_DESIGN_REPAIR: true
RUN_POST_GRT_RESIZER_TIMING: true

# --- Sign-off checks (tapeout: every one of these must be CLEAN) ---
RUN_LINTER: true
RUN_MAGIC_DRC: true
RUN_KLAYOUT_DRC: false                     # gf180mcuD ships no KLayout runset; disabled to suppress warnings
RUN_LVS: true
